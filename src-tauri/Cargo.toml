[package]
name = "pigeon"
version = "0.1.0"
description = "Mail from people you've chosen. Everyone else waits at the door."
authors = ["Pigeon contributors"]
license = "Apache-2.0"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "pigeon_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
tauri-plugin-http = "2"

# The mail engine: IMAP for reading and acting, SMTP for sending, mail-parser
# for RFC 2822 → structure. Everything speaks to Gmail's own servers directly.
#
# imap 3's alpha, deliberately, and pinned: it is the first release built on
# imap-proto 0.16, which is the first version whose FETCH grammar knows the
# X-GM-* items. imap 2 rides imap-proto 0.10, which does not — and because the
# crate parses every untagged line it reads just to find the tagged
# terminator, an unparseable line fails the whole command. That made *every*
# thread listing impossible on a real Gmail account; see `run_meta_fetch`.
imap = "=3.0.0-alpha.15"
# `imap` does not re-export imap-proto's types, and SPECIAL-USE discovery needs
# `NameAttribute` by name — see `find_special`. Cargo unifies this with the
# copy `imap` itself depends on.
imap-proto = "0.16"
mail-parser = "0.11.5"
lettre = "0.11.19"
chrono = "0.4.45"
base64 = "0.22"

# The app password belongs in the macOS Keychain, not in web storage.
keyring = { version = "3", features = ["apple-native"] }
tauri-plugin-notification = "2.3.3"

[features]
# Used for production builds, where the frontend is served from the bundle
# rather than from `devUrl`.
custom-protocol = ["tauri/custom-protocol"]

[dev-dependencies]
regex = "1"
url = "2"
urlpattern = "0.3"
