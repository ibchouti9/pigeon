[package]
name = "pigeon"
version = "0.1.0"
description = "Mail from people you've chosen. Everyone else waits at the door."
authors = ["Pigeon contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "pigeon_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3" }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3" }
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
tauri-plugin-http = "2"
tauri-plugin-dialog = "2"

# Desktop OAuth: a PKCE challenge, a loopback listener, and the token exchange.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
urlencoding = "2.1"

# The refresh token belongs in the macOS Keychain, not in web storage.
keyring = { version = "3", features = ["apple-native"] }

[features]
# Used for production builds, where the frontend is served from the bundle
# rather than from `devUrl`.
custom-protocol = ["tauri/custom-protocol"]
