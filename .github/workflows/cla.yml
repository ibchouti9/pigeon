name: CLA

# Asks a first-time contributor to sign CLA.md, once, by leaving a comment.
# Signatures are recorded on the `cla-signatures` branch of this repository,
# so there is nothing else to host and no third-party service holding them.
#
# `pull_request_target` rather than `pull_request` because the job needs a
# token that can write the signature file, and a fork's `pull_request` run has
# a read-only one. It checks out nothing from the fork, so the elevated token
# never runs untrusted code.

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, synchronize, closed]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: Check or record the signature
        if: >-
          (github.event.comment.body == 'recheck' ||
           github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') ||
          github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/version1/cla.json
          path-to-document: https://github.com/ibchouti9/pigeon/blob/main/CLA.md
          branch: cla-signatures
          allowlist: bot*,dependabot[bot]
          custom-notsigned-prcomment: >-
            Thanks for this. Before it can be merged, please sign the
            [Contributor License Agreement](https://github.com/ibchouti9/pigeon/blob/main/CLA.md)
            by replying to this thread with exactly:
          custom-pr-sign-comment: I have read the CLA Document and I hereby sign the CLA
          custom-allsigned-prcomment: CLA signed — thank you.
